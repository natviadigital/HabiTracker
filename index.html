<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HabiTracker - Rastrea visualmente tu progreso en dieta y ejercicio">
    <meta name="author" content="Natvia Digital">
    <title>HabiTracker - Seguimiento de Hábitos</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <img src="https://qzbmdqnwgoihzjxanpbq.supabase.co/storage/v1/object/public/ImagenesApp/NatviaSlim%20(1).png" 
                     alt="HabiTracker Logo" 
                     class="app-logo">
            </div>
            <h1 class="app-title">HabiTracker</h1>
            <p class="app-subtitle">Rastrea tu progreso en dieta y ejercicio</p>
        </header>

        <!-- Daily Tracker Section -->
        <section class="daily-tracker">
            <div class="tracker-card">
                <h2 class="section-title">Registro de Hoy</h2>
                <p class="current-date" id="currentDate"></p>
                
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="dietCheckbox" class="custom-checkbox">
                        <span class="checkbox-text">
                            <span class="icon">🥗</span>
                            Cumplí mi objetivo de dieta
                        </span>
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="exerciseCheckbox" class="custom-checkbox">
                        <span class="checkbox-text">
                            <span class="icon">💪</span>
                            Cumplí mi objetivo de ejercicio
                        </span>
                    </label>
                </div>
                
                <button id="saveBtn" class="save-btn">
                    <span class="btn-icon">✓</span>
                    Guardar Progreso
                </button>
            </div>
        </section>

        <!-- Calendar Navigation -->
        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevMonth" class="nav-btn" aria-label="Mes anterior">
                    <span>←</span>
                </button>
                <h2 class="calendar-title" id="calendarTitle"></h2>
                <button id="nextMonth" class="nav-btn" aria-label="Mes siguiente">
                    <span>→</span>
                </button>
            </div>

            <!-- Calendar Grid -->
            <div class="calendar-wrapper">
                <div class="calendar-weekdays">
                    <div class="weekday">Dom</div>
                    <div class="weekday">Lun</div>
                    <div class="weekday">Mar</div>
                    <div class="weekday">Mié</div>
                    <div class="weekday">Jue</div>
                    <div class="weekday">Vie</div>
                    <div class="weekday">Sáb</div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Days will be generated dynamically -->
                </div>
            </div>

            <!-- Legend -->
            <div class="legend">
                <h3 class="legend-title">Leyenda</h3>
                <div class="legend-items">
                    <div class="legend-item">
                        <span class="legend-color success"></span>
                        <span class="legend-text">Ambos objetivos cumplidos</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color partial"></span>
                        <span class="legend-text">Solo ejercicio cumplido</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color fail"></span>
                        <span class="legend-text">Ningún objetivo cumplido</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color empty"></span>
                        <span class="legend-text">Sin registro</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Desarrollado con ❤️ por <strong>Natvia Digital</strong></p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
